<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>7-Day Staff Reader — SDE Interview Visual Handbook</title>
    <meta
      name="description"
      content="A calm, editorial 7-day passive reading and visual learning companion for 4.5-YOE SDE interviews covering DSA, Low-Level Design, and High-Level Architecture."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2311141B'/%3E%3Cpath d='M9 10h14v2.5H14.5L21 22h-3.4l-6.2-9.5V22H9V10z' fill='%2360A5FA'/%3E%3C/svg%3E"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('staff-reader:theme');
          var theme = saved === 'light' ? 'light' : 'dark';
          var root = document.documentElement;
          root.classList.remove('dark', 'light');
          root.classList.add(theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-blue-500/25 selection:text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
